<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Cancelado — Mari Faria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --cream: #F7F3EE; --sand: #E8DDD0; --gold: #B8963E; --gold-light: #D4B06A; --dark: #1C1710; --mid: #5C4F3A; }
  body { background: var(--cream); color: var(--dark); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { text-align: center; padding: 3rem 2rem; max-width: 520px; }
  .icon { font-size: 3.5rem; margin-bottom: 1.5rem; }
  .label { font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 300; line-height: 1.15; margin-bottom: 1rem; }
  .divider { width: 50px; height: 1px; background: var(--gold); margin: 1.5rem auto; }
  p { font-size: 0.95rem; line-height: 1.9; color: var(--mid); margin-bottom: 0.75rem; }
  .btn { display: inline-block; margin-top: 2rem; padding: 0.85rem 2.5rem; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; transition: all 0.35s; }
  .btn:hover { background: var(--gold); color: var(--cream); }
</style>
</head>
<body>
<div class="container">
  <div class="icon">◇</div>
  <p class="label">Pagamento cancelado</p>
  <h1>A tua encomenda<br><em style="font-style:italic;color:var(--gold)">não foi processada</em></h1>
  <div class="divider"></div>
  <p>O pagamento foi cancelado e não foi efetuado nenhum débito.</p>
  <p>O teu carrinho continua guardado. Podes retomar a compra quando quiseres.</p>
  <a href="/" class="btn">Voltar à loja</a>
</div>
</body>
</html>
